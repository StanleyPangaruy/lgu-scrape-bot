{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block public %}
<div class="panel stack">
  <div>
    <h1>LGU Comment Monitor</h1>
    <p class="muted">Sign in with the account the admin gave you.</p>
  </div>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
