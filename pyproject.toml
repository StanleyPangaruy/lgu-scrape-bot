[project]
name = "lgu-scrape-bot"
version = "0.2.0"
description = "LGU Comment Monitor: Facebook comment collection (Playwright) and a dashboard website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "anthropic>=2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lgu-scrape-bot = "main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["scraper", "storage", "server", "agent"]

[tool.setuptools.package-data]
server = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
